name: Helm lint
on:
  pull_request:
    paths:
      - 'kubernetes/**'
      - '.tool-versions'
      - '.github/actions/**'
      - '.github/workflows/lint-helm.yaml'
  push:
    branches:
      - master
    paths:
      - 'kubernetes/**'
      - '.tool-versions'
      - '.github/actions/**'
      - '.github/workflows/lint-helm.yaml'

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Lint
        run: >
          helm lint kubernetes/*/*
